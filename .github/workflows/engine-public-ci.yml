name: engine-public-ci

# CI for the public engine repository. This file is what the exporter copies
# to the public tree. The repository root is the engine: there is no engine/
# subdirectory, no gateway app, and no platform schema.
#
# The private monorepo proves the same steps from .github/workflows/engine-public-ci.yml
# with a `working-directory` of engine, on ubuntu with Node 22 only. This file runs them
# on five legs (below). The exclude list is the same in both files.
# No secrets, no second install, no paid model, no LongMemEval, no agent gate.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: engine-public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-engine:
    # One check per leg. The ubuntu / Node 22 leg keeps the name `public-engine`, so a branch rule
    # that requires it still matches. fail-fast is off: one leg failing must not hide what the
    # others say.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Every step is written for bash. Windows runners default to PowerShell, so name bash for every leg; on Linux and
    # macOS it was already the shell (now also with pipefail, and no step pipes).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # What package.json supports.
          - name: public-engine
            os: ubuntu-latest
            node: '22'
          # People clone the repository on a Mac, where /var is a symlink to private/var.
          - name: public-engine-macos
            os: macos-latest
            node: '22'
          # package.json says >=22 <23. This leg is the evidence for widening that range; it
          # changes nothing by itself.
          - name: public-engine-node24
            os: ubuntu-latest
            node: '24'
          # Windows runners are free for a public repository. Windows has no POSIX mode bits, so the tests that assert
          # owner-only modes skip there, as the engine's own owner-only checks do.
          - name: public-engine-windows
            os: windows-latest
            node: '22'
          # npm 12 is npm's latest major; Node 22 ships npm 10. Same install from the same lockfile.
          - name: public-engine-npm12
            os: ubuntu-latest
            node: '22'
            npm: '12'
    steps:
      # RenorBench baseline tests compare the committed baseline with origin/main.
      # A shallow checkout does not have that ref.
      # Actions are pinned to the commit SHA of the tag, not the mutable tag:
      # this workflow runs on pull_request from forks, so a moved tag would run
      # attacker-chosen code. Keep the SHA and the version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm ${{ matrix.npm }}
        if: matrix.npm
        run: npm install -g npm@${{ matrix.npm }} && npm --version

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck eval
        run: npx tsc -p tsconfig.public-eval.json --noEmit

      - name: Build
        run: npm run build

      # Gateway-bound tests and the platform-schema test are not in the public
      # tree. The excludes stay so this command matches the monorepo proof and
      # does not start passing because a private file was copied back in.
      # Quote every glob.
      - name: Unit tests
        run: |
          npm test -- --maxWorkers=2 \
            --exclude 'tests/**/gateway-*.test.ts' \
            --exclude 'tests/review/on-demand-admission.test.ts' \
            --exclude 'tests/review/activation-broker.test.ts' \
            --exclude 'tests/review/dashboard-import-gateway.test.ts' \
            --exclude 'tests/mvp/loud-connection.test.ts' \
            --exclude 'tests/mvp/owner-rule-key.test.ts' \
            --exclude 'tests/mvp/browser-login.test.ts' \
            --exclude 'tests/review/connect-token-membership.test.ts'

      # Offline hash embedder. Does not read a dataset and does not call a model.
      - name: Eval hash smoke
        run: npm run eval:renor:hash -- --output .eval-runs/ci-hash-smoke

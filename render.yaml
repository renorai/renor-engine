# Render Blueprint: Renor's HTTP server, built from ./Dockerfile, with the memory on a persistent disk.
# Deploy: https://render.com/deploy?repo=https://github.com/renorai/renor-engine
# A disk needs a paid instance type (Render's free instances have no disk). Every setting: docs/self-hosting.md.
services:
  - type: web
    name: renor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: renor-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # The one login that can authorize an agent. Render asks for it when you create the Blueprint.
      - key: MVP_OWNER_EMAIL
        sync: false
      # Generated by Render (random, 256 bits); read it in the service's Environment tab to sign in.
      - key: MVP_OWNER_PASSWORD
        generateValue: true
      # Redirects an agent may register, comma-separated and exact. This one is Claude Code's with --callback-port 39472.
      - key: MVP_ALLOWED_CALLBACK_URIS
        value: http://localhost:39472/callback
      # Render's proxy reaches the server over the network, so listen beyond loopback (the server then requires the
      # https base URL, which the entrypoint takes from RENDER_EXTERNAL_URL), and count that proxy as the one hop so each
      # client gets its own rate-limit bucket.
      - key: MVP_HOST
        value: 0.0.0.0
      # Keep it at 1: a higher number than the real proxy count lets a client choose its own address. The server refuses
      # a trusted hop on a public bind unless the acknowledgement below confirms Render's proxy is the only way in.
      - key: MVP_TRUST_PROXY_HOPS
        value: "1"
      - key: MVP_TRUST_PROXY_HOPS_ACK_SPOOFING
        value: "1"
      # none: no embedding model and no key; search matches words. openai needs MVP_EMBEDDING_API_KEY.
      - key: MVP_EMBEDDING_PROVIDER
        value: none
